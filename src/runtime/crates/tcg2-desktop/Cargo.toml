[package]
name = "tcg2-desktop"
description = "The desktop app (Linux, macOS, Windows): an SDL3 window and 2D renderer, keyboard and gamepads, sound, battery saves, and a game clock that sleeps between frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pokemon-tcg2"
path = "src/main.rs"

[features]
# Builds SDL3 from source and links it statically (release builds for macOS
# and Windows, where no system SDL3 is expected).
static-sdl = ["sdl3-sys/build-from-source-static"]

[dependencies]
tcg2-core = { path = "../tcg2-core" }
tcg2-kernel = { path = "../tcg2-kernel" }
tcg2-render = { path = "../tcg2-render" }
sdl3-sys.workspace = true
png.workspace = true

